<!DOCTYPE html>
<!--
    Dev-only lab: runs acceptance scenarios on the real GPU simulation (src/lab, docs/lab.md).
    Served by `make dev` at /particle-simulator/lab.html; vite.config.ts has no `input`, so
    `make build` never builds it (the check-dist target of the Makefile guards that).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Particle Simulator lab (dev only)</title>
    <style>
        :root { color-scheme: dark; --bg: #0c0c10; --fg: #ececf1; --dim: #a3a3b0; --line: rgba(255, 255, 255, 0.13);
                --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
        h1 { margin: 0 0 4px; font-size: 18px; }
        .dim { color: var(--dim); }
        #lab-renderer, #lab-status { font-family: var(--mono); font-size: 12px; }
        .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
        input, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
        input { min-width: 22em; }
        button { cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; }
        th, td { border-top: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
        td:nth-child(2) { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
        .metrics { font-family: var(--mono); font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
        .badge { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
        .status-pass .badge { color: var(--ok); }
        .status-fail .badge { color: var(--bad); }
        .status-skip .badge { color: var(--warn); }
        .status-known-failure .badge { color: var(--warn); }
        pre { font-family: var(--mono); font-size: 11px; background: rgba(255, 255, 255, 0.04); padding: 8px; overflow: auto; max-height: 40vh; }
        #lab-canvas { display: none; }
    </style>
</head>
<body>
    <h1>Particle Simulator lab <span class="dim">(dev only)</span></h1>
    <div id="lab-renderer" class="dim">renderer: starting...</div>
    <div id="lab-status" class="dim"></div>
    <div class="bar">
        <input id="lab-filter" type="text" placeholder="scenarios: ids, groups or tags (empty: all)" aria-label="Scenarios to run">
        <button id="lab-run" type="button">Run</button>
    </div>
    <table id="lab-table">
        <thead><tr><th>Status</th><th>Id</th><th>Title</th><th>Time</th><th>Details</th></tr></thead>
        <tbody></tbody>
    </table>
    <details><summary class="dim">Registered scenarios</summary><pre id="lab-list"></pre></details>
    <h2>window.__labResults</h2>
    <pre id="lab-json"></pre>
    <div id="lab-canvas"></div>
    <script type="module" src="/src/lab/main.ts"></script>
</body>
</html>
