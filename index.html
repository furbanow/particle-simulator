<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simulateur de particules GPGPU multi-espèces : gravité, supernovae, bloom HDR et nébuleuse.">
    <title>Gravité &amp; Supernova</title>
    <meta name="author" content="furbanow@gmail.com, Software Engineering">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gravité &amp; Supernova">
    <meta property="og:description" content="Simulateur de particules GPGPU multi-espèces : gravité, supernovae, bloom HDR et nébuleuse.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Hide the page until the stylesheet is applied (base.css reveals it), to avoid a flash of unstyled UI. -->
    <style>html { background: #000; } body { opacity: 0; }</style>
</head>
<body>
<div id="ui-panel">
    <header class="panel-header">
        <div class="brand">
            <img class="logo" src="/logo.png" alt="" width="30" height="30">
            <div class="brand-text">
                <h1>Particle Simulator</h1>
                <p class="subtitle">GPGPU multi-espèces</p>
            </div>
            <div class="brand-actions">
                <button id="hidePanelBtn" class="icon-btn" title="Masquer le panneau (H)" aria-label="Masquer le panneau">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M15.5 10l-2 2 2 2"/></svg></button>
            </div>
        </div>
        <div id="simulationConfig" class="simulation-config">
            <label for="simulationConfigSelect" class="config-title">Configuration de la simulation</label>
            <div class="config-picker">
                <select id="simulationConfigSelect" class="config-select" title="Charger une configuration"></select>
                <input class="config-name" type="text" maxlength="40" aria-label="Nom de la configuration" spellcheck="false" hidden>
                <span class="dirty-dot" title="Modifications non enregistrées" hidden></span>
            </div>
            <div class="config-tools">
                <button class="btn icon-only config-new" type="button" title="Nouvelle configuration (valeurs par défaut de l'algorithme courant)" aria-label="Nouvelle configuration">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                <button class="btn icon-only config-duplicate" type="button" title="Dupliquer la configuration" aria-label="Dupliquer la configuration">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
                <button class="btn icon-only config-rename" type="button" title="Renommer la configuration" aria-label="Renommer la configuration">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg></button>
                <button class="btn icon-only config-delete" type="button" title="Supprimer la configuration" aria-label="Supprimer la configuration">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span class="confirm-label">Supprimer ?</span></button>
                <button class="btn icon-only config-save" type="button" title="Enregistrer dans la configuration" aria-label="Enregistrer la configuration">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg></button>
            </div>
        </div>
        <button id="startBtn" class="btn-primary" title="Redémarrer la simulation (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
            Redémarrer<kbd>R</kbd></button>
        <div id="algorithmPicker" class="algo-picker">
            <label for="algorithmSelect" class="algo-label">Algorithme</label>
            <select id="algorithmSelect"></select>
        </div>
        <div id="speedDock" class="speed-dock" data-tooltip="Fait défiler le temps simulé plus ou moins vite. N'agit que sur le rythme de l'animation : à 1×, une seconde simulée dure une seconde ; à 0, la simulation est en pause.">
            <div class="speed-head">
                <svg class="speed-gauge" viewBox="0 0 24 24" aria-hidden="true">
                    <path class="speed-arc" d="M4.5 16a7.5 7.5 0 1 1 15 0"/>
                    <path class="speed-needle" d="M12 16V9.5"/>
                    <circle cx="12" cy="16" r="1.6"/></svg>
                <label for="speedSlider" class="speed-label">Vitesse de simulation</label>
                <span id="speedVal" class="speed-value">1.0×</span>
            </div>
            <input type="range" id="speedSlider" min="0" max="3" step="0.1" value="1" aria-label="Vitesse de simulation">
            <div class="speed-ticks" aria-hidden="true">
                <span style="--at: 0">Pause</span>
                <span style="--at: 1">1×</span>
                <span style="--at: 2">2×</span>
                <span style="--at: 3">3×</span>
            </div>
        </div>
    </header>

    <!-- The tabs and the parameters they hold are built from the declarations (ParamPanel). -->
    <div id="panelTabs" class="panel-tabs" role="tablist" aria-label="Paramètres" aria-orientation="horizontal"></div>
    <div id="panelTabContent" class="panel-scroll"></div>
</div>
<!-- Advanced element editor: a large, semi-transparent modal opened from the panel's Elements tab (ElementBar). -->
<div id="elements-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="elementBarTitle">
        <button class="icon-btn modal-close" type="button" title="Fermer (Échap)" aria-label="Fermer">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <section id="element-bar">
            <div class="ebar-head">
                <span class="ebar-title" id="elementBarTitle">Éléments</span>
                <div class="config-picker">
                    <select class="config-select" title="Charger une configuration" aria-label="Configuration d'éléments"></select>
                    <input class="config-name" type="text" maxlength="40" aria-label="Nom de la configuration" spellcheck="false" hidden>
                    <span class="dirty-dot" title="Modifications non enregistrées" hidden></span>
                </div>
                <div class="config-tools">
                    <button class="btn icon-only config-new" type="button" title="Nouvelle configuration (éléments chimiques)" aria-label="Nouvelle configuration">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                    <button class="btn icon-only config-duplicate" type="button" title="Dupliquer la configuration" aria-label="Dupliquer la configuration">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
                    <button class="btn icon-only config-rename" type="button" title="Renommer la configuration" aria-label="Renommer la configuration">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg></button>
                    <button class="btn icon-only config-delete" type="button" title="Supprimer la configuration" aria-label="Supprimer la configuration">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span class="confirm-label">Supprimer ?</span></button>
                    <button class="btn config-save" type="button" title="Enregistrer dans la configuration">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Enregistrer</button>
                </div>
                <div id="elementsHint" class="hint pending"></div>
                <label class="field ebar-count">
                    <span class="field-row"><span id="typeCountLabel">Nombre d'éléments</span> <span id="typeCountVal" class="value-display"></span></span>
                    <input type="range" id="typeCountSlider" min="1" max="10" step="1" value="10">
                </label>
            </div>
            <div class="ebar-body">
                <div id="chartGrid" class="chart-grid"></div>
                <section class="ebar-card ebar-editor">
                    <div class="ebar-card-head"><h2 id="elementEditorTitle">Élément</h2></div>
                    <div id="elementEditor" class="element-editor"></div>
                </section>
            </div>
        </section>
    </div>
</div>
<button id="showPanelBtn" class="icon-btn" title="Afficher le panneau (H)" aria-label="Afficher le panneau">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16M13.5 10l2 2-2 2"/></svg></button>
<div id="sim-container"></div>
<!-- Author: discreet, see-through overlay in the bottom-left corner of the animation. -->
<address id="authorOverlay" class="author">
    <span>Author: <a class="author-email" href="mailto:furbanow@gmail.com">furbanow@gmail.com</a></span>
    <span class="author-title">Software Engineering</span>
</address>
<!-- Keyboard shortcuts: discreet overlay in the top-left corner of the animation, under the element bar. -->
<footer class="shortcuts">
    <span><kbd>R</kbd>redémarrer</span>
    <span><kbd>H</kbd>panneau</span>
    <span>double-clic : valeur par défaut</span>
</footer>
<div id="statsOverlay" class="stats-overlay">
    <button id="toggleStatsBtn" class="icon-btn stats-toggle" type="button" aria-controls="statGrid">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/><path class="eye-slash" d="M4 4l16 16"/></svg></button>
    <!-- Live stats over the animation; the selected algorithm's stats are appended here (Stats). -->
    <aside id="statGrid" class="stat-grid" aria-label="Statistiques">
        <div class="stat"><div class="stat-label">FPS</div><div class="stat-value" id="fpsVal" title="Images par seconde">–</div></div>
        <div class="stat"><div class="stat-label">Particules actives</div><div class="stat-value" id="activeVal">–</div></div>
        <div class="stat"><div class="stat-label" id="typesActiveLabel">Éléments actifs</div><div class="stat-value" id="typesActiveVal">–</div></div>
    </aside>
</div>
<div id="error"></div>
<div id="tooltip" class="tooltip" role="tooltip"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
